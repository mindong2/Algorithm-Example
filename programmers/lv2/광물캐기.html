    </pre>

    <script>
        function solution(picks, minerals) {
            let answer = 0;
            const [dia, iron, stone] = picks;
            const pickSum = dia + iron + stone;
            const arr = [];
            
            for(let i = 0; i < minerals.length; i+=5){
                const obj = {d:0, i: 0, s:0};
                for(let j = i; j < i + 5 && j < pickSum * 5; j++) {
                    if(minerals[j] === 'diamond') obj.d += 1;
                    if(minerals[j] === 'iron') obj.i += 1;
                    if(minerals[j] === 'stone') obj.s += 1;
                }
                arr.push(obj);
            }
            
            arr.forEach(v => {
                v.score = v.d * 25 + v.i * 5 + v.s;
            })
            
            arr.sort((a, b) => b.score - a.score);
            
            let [diaNum, ironNum, stoneNum] = [dia, iron, stone];
            
            for(const obj of arr) {
                if(diaNum > 0) {
                    answer += obj.d + obj.i + obj.s;
                    diaNum--;
                }else if(ironNum > 0) {
                    answer += (obj.d * 5) + obj.i + obj.s;
                    ironNum--;
                }else if(stoneNum > 0) {
                    answer += (obj.d * 25) + (obj.i * 5) + obj.s;
                    stoneNum--;
                }
            }
            
            return answer;
        }

        console.log(solution([1, 3, 2], ["diamond", "diamond", "diamond", "iron", "iron", "diamond", "iron", "stone"])) // 12
    // console.log(solution([0, 1, 1], ["diamond", "diamond", "diamond", "diamond", "diamond", "iron", "iron", "iron", "iron", "iron", "diamond"])) // 50
    </script>
